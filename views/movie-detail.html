<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <nav class="navbar">
        <h1 class="logo">🎬 MovieVault</h1>
        <div style="display: flex; gap: 10px;">
            <a href="/" class="btn btn-secondary">← Back</a>
            <a href="/login.html" class="btn btn-secondary" id="login-link">Login</a>
            <button class="btn btn-secondary" id="logout-btn" style="display: none;">Logout</button>
        </div>
    </nav>

    <div id="movie-detail-container">
        <!-- Yahan JS se movie ka data aayega -->
    </div>
    <div class="form-card" style="max-width: 600px;">
    <h2>Add a Review</h2>
    <form id="review-form">
        <div class="form-group">
            <label for="user">Your Name</label>
            <input type="text" id="user" required>
        </div>
        <div class="form-group">
            <label for="comment">Comment</label>
            <input type="text" id="comment" required>
        </div>
        <div class="form-group">
            <label for="stars">Rating (1-10)</label>
            <input type="number" id="stars" min="1" max="10" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit Review</button>
    </form>
</div>
    <script src="/auth.js"></script>
    <script src="/movie-detail.js"></script>
</body>

</html>
